<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTC-8" />
        <Title>Leap Year</Title>
    </head>
    <body> 
        <p id="target"></p>
        <script>
            "use strict";
            
            const year = Number(prompt("Give a year: "));

            if (year % 400 === 0) {
                document.quarySelector("#target").innerHTML =
                "The year is a leap year.";
            } else if (year % 100 === 0) {
                document.quarySelector("#target").innerHTML =
                "The year is not a leap year.";
            } else if (year % 4 === 0) {
                document.quarySelector("#target").innerHTML =
                "The year is a leap year.";
            } else {
                document.quarySelector("#target").innerHTML =
                "The year is not a leap year.";
            }
        </script>
    </body>
</html>
