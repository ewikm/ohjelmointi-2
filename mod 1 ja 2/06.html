<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Square root</title>
    </head>
    <body>
        <p id="target"></p>
        <script>
            "use strict";
            const answer = confirm("Should I calculate the square root?: ");

            if (answer === true) {
                const number = Number(prompt("give a number: "));

                if (number < 0) {
                document.querySelector("#target").innerHTML =
                    "The square root could not be calculated";
                } else {
                const result = Math.sqrt(number);
                document.querySelector("#target").innerHTML =
                    "The square root is " + result;
                }
            } else {
                document.querySelector("#target").innerHTML =
                    "The square root wont be calculated.";
            }
        </script>
    </body>
</html>
