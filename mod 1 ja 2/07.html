<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTC-8"/>
        <title>Dice</title>
    </head>
    <body>
        <p id="target"></p>
        <script>
            "use strict";

            let rolls = Number(prompt("How many dice rolls?: "));
            let sum = 0;

            for (let i = 0; i < rolls; i++) {
                const die = Math.floor(Math.random() * 6) + 1;
                sum =+ die;
            }

            console.log("The result of the dice rolls is: " + sum);
        </script>
    </body>
</html>
