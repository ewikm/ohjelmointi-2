<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8"/>
    </head>
    <body>
        <p id="target"></p>
        <script>
            "use strict";
            const number1 = number(prompt("Enter a number: "));
            const number2 = number(prompt("Enter another number: "));   
            const number3 = number(prompt("Enter a third number: "));

            const sum = number1 + number2 + number3;
            const product = number1 * number2 * number3;
            const average = sum / 3;
            

            document.querySelector("target"). innerHTML =
            "Sum: " + sum + "<br>" +
            "Product: " + product + "<br>" +
            "Average: " + average;
        </script>
    </body>
</html>
