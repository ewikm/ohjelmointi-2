 <!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>numbers</title>
    </head>
    <body>
        <script>
            "use strict";

            const numbers = [];
            let n = Number(prompt("Enter a number(0 to stop): "));


            while (n !== 0) {
                numbers.push(n);
                n = Number(prompt("Enter a number (0 to stop): "));
            }
            numbers.sort(function (a, b) {
                return b - a;
            });
            for (let i = 0; i <numbers.lenght; i++) {
                console.log(numbers[i]);
            }
        </script>
    </body>
</html>
